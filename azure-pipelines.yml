# Triggered by ext/v* tags created by .github/workflows/release.yml
# per reqlan rq/distribution/distribution.rq extension_distribution / vsix_export.

trigger:
  tags:
    include:
      - refs/tags/ext/v*

variables:
  - group: "reqlan pipeline variables"

jobs:
  # One agent per native_targets tuple (same matrix as .github/workflows/deploy-npm.yml).
  # Platform npm packages may not exist yet; VSIX packaging must not depend on npm pack.
  - job: build_native
    displayName: Build napi
    timeoutInMinutes: 60
    strategy:
      matrix:
        linux_x64:
          napiSuffix: linux-x64-gnu
          rustTarget: x86_64-unknown-linux-gnu
          imageName: ubuntu-latest
        linux_arm64:
          napiSuffix: linux-arm64-gnu
          rustTarget: aarch64-unknown-linux-gnu
          imageName: ubuntu-latest
        darwin_x64:
          napiSuffix: darwin-x64
          rustTarget: x86_64-apple-darwin
          imageName: macOS-latest
        darwin_arm64:
          napiSuffix: darwin-arm64
          rustTarget: aarch64-apple-darwin
          imageName: macOS-latest
        win32_x64:
          napiSuffix: win32-x64-msvc
          rustTarget: x86_64-pc-windows-msvc
          imageName: windows-latest
        win32_arm64:
          napiSuffix: win32-arm64-msvc
          rustTarget: aarch64-pc-windows-msvc
          imageName: windows-latest
    pool:
      vmImage: $(imageName)

    steps:
      - checkout: self
        clean: true
        timeoutInMinutes: 5

      - task: UseNode@1
        inputs:
          version: "24.x"
        displayName: Setup Node.js
        timeoutInMinutes: 10

      - bash: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "##vso[task.prependpath]$HOME/.cargo/bin"
        displayName: Install Rust
        condition: ne(variables['Agent.OS'], 'Windows_NT')
        timeoutInMinutes: 10

      - pwsh: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://static.rust-lang.org/rustup/dist/x86_64-pc-windows-msvc/rustup-init.exe" -OutFile rustup-init.exe
          & .\rustup-init.exe -y --default-toolchain stable
          Write-Host "##vso[task.prependpath]$env:USERPROFILE\.cargo\bin"
        displayName: Install Rust
        condition: eq(variables['Agent.OS'], 'Windows_NT')
        timeoutInMinutes: 10

      - script: rustup target add $(rustTarget)
        displayName: Add Rust target
        timeoutInMinutes: 5

      - bash: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
        displayName: Linux arm64 cross linker
        condition: eq(variables['napiSuffix'], 'linux-arm64-gnu')
        timeoutInMinutes: 10

      - script: cargo build -p reqlan-napi --release --target $(rustTarget)
        displayName: Build reqlan-napi
        workingDirectory: crates
        timeoutInMinutes: 30
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - script: node scripts/collect-napi-binary.mjs --target $(napiSuffix)
        displayName: Collect napi binary
        timeoutInMinutes: 5

      - task: PublishPipelineArtifact@1
        displayName: Publish napi artifact
        inputs:
          targetPath: artifacts/napi/$(napiSuffix)
          artifact: napi-$(napiSuffix)

  - job: build_test_package
    displayName: Build, test, package extension
    dependsOn: build_native
    timeoutInMinutes: 90
    cancelTimeoutInMinutes: 5
    pool:
      vmImage: ubuntu-latest

    steps:
      - checkout: self
        clean: true
        timeoutInMinutes: 5

      - task: UseNode@1
        inputs:
          version: "24.x"
        displayName: Setup Node.js
        timeoutInMinutes: 10

      - pwsh: |
          $ErrorActionPreference = "Stop"
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          node --version
          pnpm --version
        displayName: Setup pnpm
        timeoutInMinutes: 10

      - pwsh: |
          $ErrorActionPreference = "Stop"
          pnpm install --frozen-lockfile
        displayName: Install dependencies
        timeoutInMinutes: 15

      - task: DownloadPipelineArtifact@2
        displayName: Download napi artifacts
        inputs:
          buildType: current
          targetPath: $(Build.SourcesDirectory)/artifacts/napi-download

      - bash: |
          set -euo pipefail
          mkdir -p artifacts/napi
          for dir in artifacts/napi-download/napi-*; do
            suffix="${dir##*/napi-}"
            mkdir -p "artifacts/napi/${suffix}"
            cp -a "${dir}/." "artifacts/napi/${suffix}/"
          done
          node scripts/prepare-native-packages.mjs --binary-dir artifacts/napi
        displayName: Stage platform packages from napi artifacts
        timeoutInMinutes: 5

      - pwsh: |
          $ErrorActionPreference = "Stop"
          node scripts/ensure-host-native.mjs
        displayName: Ensure host native optionalDependency
        timeoutInMinutes: 10

      - pwsh: |
          $ErrorActionPreference = "Stop"
          pnpm run langium:generate
          pnpm exec tsc -b tsconfig.build.json
          pnpm --filter '!./site' -r run build
          pnpm run sync:cursor
        displayName: Build packages (skip site)
        timeoutInMinutes: 20

      - pwsh: |
          $ErrorActionPreference = "Stop"
          pnpm run test
        displayName: Run tests
        timeoutInMinutes: 15

      - pwsh: |
          $ErrorActionPreference = "Stop"
          $tagRef = "$(Build.SourceBranch)"
          if (-not $tagRef.StartsWith("refs/tags/ext/v")) {
            Write-Host "Not an extension release tag build."
            exit 0
          }

          $tagVersion = $tagRef.Substring("refs/tags/ext/v".Length)
          $packageVersion = node -p "require('./packages/extension/package.json').version"
          Write-Host "Tag version: $tagVersion"
          Write-Host "Package version: $packageVersion"

          if ($tagVersion -ne $packageVersion) {
            throw "Extension package.json version ($packageVersion) must match tag suffix ($tagVersion)."
          }
        displayName: Verify extension version matches tag
        timeoutInMinutes: 5

      - pwsh: |
          $ErrorActionPreference = "Stop"
          node scripts/package-extension-targets.mjs
        displayName: Package per-target VSIXes
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/ext/v'))
        timeoutInMinutes: 20

      - task: PublishBuildArtifacts@1
        displayName: Publish VSIX artifacts
        condition: succeeded()
        timeoutInMinutes: 8
        inputs:
          PathtoPublish: packages/extension/vsix-out
          ArtifactName: reqlan-vsix
          publishLocation: Container

      - task: AzureCLI@2
        displayName: Publish extension (all targets)
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/ext/v'))
        timeoutInMinutes: 30
        inputs:
          azureSubscription: $(AzureMarketplaceServiceConnection)
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = "Stop"
            # AzureCLI@2 logs in via the ARM service connection; vsce obtains the
            # Entra ID access token for the Marketplace resource via --azure-credential.
            Get-ChildItem packages/extension/vsix-out/*.vsix | ForEach-Object {
              Write-Host "Publishing $($_.FullName)"
              pnpm --filter ./packages/extension exec vsce publish --no-dependencies --packagePath $_.FullName --azure-credential
            }

      - pwsh: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem packages/extension/vsix-out/*.vsix | ForEach-Object {
            Write-Host "Open VSX $($_.FullName)"
            pnpm dlx ovsx publish $_.FullName
          }
        displayName: Publish extension to Open VSX (all targets)
        condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/ext/v'))
        timeoutInMinutes: 30
        env:
          OVSX_PAT: $(OpenVSX Token)
