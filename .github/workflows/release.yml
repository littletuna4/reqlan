# rq:["../../reqlan rq/distribution/distribution.rq".deployment_flow]
# rq:["../../reqlan rq/distribution/distribution.rq".ci_gate]
# rq:["../../reqlan rq/distribution/distribution.rq".prerelease_tests]
name: Release packages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [ci]
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      site_tag: ${{ steps.tags.outputs.site_tag }}
      extension_tag: ${{ steps.tags.outputs.extension_tag }}
      npm_ref: ${{ steps.tags.outputs.npm_ref }}
      analytical_tag: ${{ steps.tags.outputs.analytical_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Detect pending changesets
        id: pending
        run: |
          shopt -s nullglob
          files=(.changeset/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "has_pending=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for file in "${files[@]}"; do
            if [ "$(basename "$file")" != "README.md" ]; then
              echo "has_pending=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "has_pending=false" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.pending.outputs.has_pending == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        if: steps.pending.outputs.has_pending == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.pending.outputs.has_pending == 'true'
        run: pnpm install --frozen-lockfile

      - name: Capture package versions before apply
        if: steps.pending.outputs.has_pending == 'true'
        id: versions
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const readVersion = (path) => JSON.parse(fs.readFileSync(path, 'utf8')).version;

          const outputs = [
            ['extension_before', readVersion('packages/extension/package.json')],
            ['site_before', readVersion('site/package.json')],
            ['language_before', readVersion('packages/language/package.json')],
            ['analytical_before', readVersion('packages/analytical/package.json')],
            ['cli_before', readVersion('packages/cli/package.json')],
            ['mcp_before', readVersion('packages/mcp/package.json')],
          ];

          for (const [name, value] of outputs) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          EOF

      - name: Apply changesets
        if: steps.pending.outputs.has_pending == 'true'
        run: |
          pnpm changeset version
          # Platform packages are Changesets-ignored; copy version from @reqlan/analytical.
          node scripts/prepare-native-packages.mjs

      - name: Commit version bumps
        if: steps.pending.outputs.has_pending == 'true'
        id: commit
        run: |
          if git diff --quiet; then
            echo "No version changes after changeset apply."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): version packages"
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Create release tags
        if: steps.pending.outputs.has_pending == 'true'
        id: tags
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const readVersion = (path) => JSON.parse(fs.readFileSync(path, 'utf8')).version;
          const packages = [
            { beforeEnv: 'EXTENSION_BEFORE', path: 'packages/extension/package.json', prefix: 'ext/v' },
            { beforeEnv: 'SITE_BEFORE', path: 'site/package.json', prefix: 'site/v' },
            { beforeEnv: 'LANGUAGE_BEFORE', path: 'packages/language/package.json', prefix: 'language/v' },
            { beforeEnv: 'ANALYTICAL_BEFORE', path: 'packages/analytical/package.json', prefix: 'analytical/v' },
            { beforeEnv: 'CLI_BEFORE', path: 'packages/cli/package.json', prefix: 'cli/v' },
            { beforeEnv: 'MCP_BEFORE', path: 'packages/mcp/package.json', prefix: 'mcp/v' },
          ];

          const tags = [];
          for (const pkg of packages) {
            const before = process.env[pkg.beforeEnv];
            const after = readVersion(pkg.path);
            if (before !== after) {
              tags.push(`${pkg.prefix}${after}`);
            }
          }

          if (tags.length === 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'created=false\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'site_tag=\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'extension_tag=\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'npm_ref=\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'analytical_tag=\n');
            process.exit(0);
          }

          for (const tag of tags) {
            execFileSync(
              'git',
              ['tag', '-a', tag, '-m', `Release ${tag}`],
              { stdio: 'inherit' },
            );
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'created=true\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tags=${tags.join(',')}\n`);

          const siteTag = tags.find((tag) => tag.startsWith('site/v')) ?? '';
          const extensionTag = tags.find((tag) => tag.startsWith('ext/v')) ?? '';
          const analyticalTag = tags.find((tag) => tag.startsWith('analytical/v')) ?? '';
          const npmRef =
            tags.find((tag) =>
              tag.startsWith('language/v') ||
              tag.startsWith('analytical/v') ||
              tag.startsWith('cli/v') ||
              tag.startsWith('mcp/v'),
            ) ?? '';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `site_tag=${siteTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `extension_tag=${extensionTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_ref=${npmRef}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `analytical_tag=${analyticalTag}\n`);
          EOF
        env:
          EXTENSION_BEFORE: ${{ steps.versions.outputs.extension_before }}
          SITE_BEFORE: ${{ steps.versions.outputs.site_before }}
          LANGUAGE_BEFORE: ${{ steps.versions.outputs.language_before }}
          ANALYTICAL_BEFORE: ${{ steps.versions.outputs.analytical_before }}
          CLI_BEFORE: ${{ steps.versions.outputs.cli_before }}
          MCP_BEFORE: ${{ steps.versions.outputs.mcp_before }}

      - name: Push release commit
        if: steps.pending.outputs.has_pending == 'true' && steps.commit.outputs.committed == 'true'
        run: git push origin HEAD:main

      - name: Push release tags
        if: steps.pending.outputs.has_pending == 'true' && steps.tags.outputs.created == 'true'
        run: |
          IFS=',' read -ra TAGS <<< "${{ steps.tags.outputs.tags }}"
          for tag in "${TAGS[@]}"; do
            echo "Pushing tag ${tag}"
            git push origin "refs/tags/${tag}"
          done

  deploy-site:
    needs: release
    if: needs.release.outputs.site_tag != ''
    uses: ./.github/workflows/deploy-site.yml
    with:
      site_tag: ${{ needs.release.outputs.site_tag }}
    permissions:
      contents: read
      pages: write
      id-token: write

  deploy-npm:
    needs: release
    if: needs.release.outputs.npm_ref != ''
    uses: ./.github/workflows/deploy-npm.yml
    with:
      npm_ref: ${{ needs.release.outputs.npm_ref }}
      analytical_tag: ${{ needs.release.outputs.analytical_tag }}
    permissions:
      contents: read
      id-token: write
