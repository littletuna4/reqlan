# rq:["../../reqlan rq/distribution/distribution.rq".prerelease_tests]
# rq:["../../reqlan rq/distribution/distribution.rq".ci_gate]
# rq:["../../reqlan rq/development/build.rq".typescript_compile]
name: Pre-release tests

# Package tests are not a pull-request gate.
# release.yml calls this before versioning so a push to main
# must not tag or publish until JS/TS tests pass.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host native addon
        run: node scripts/ensure-host-native.mjs
      - name: Build TypeScript
        run: pnpm run build:tsc
      - name: Test packages
        run: pnpm run test
