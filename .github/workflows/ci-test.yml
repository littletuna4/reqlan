# rq:["../../reqlan rq/distribution/distribution.rq".prerelease_tests]
# rq:["../../reqlan rq/distribution/distribution.rq".ci_gate]
# rq:["../../reqlan rq/development/build.rq".typescript_compile]
# rq:["../../reqlan rq/core_analysis/check.rq".check]
# rq:["../../reqlan rq/core_analysis/check.rq".check_meta_implementation]
# rq:["../../reqlan rq/core_analysis/check.rq".check_skip_targets]
name: Build, test, and check

# Pull requests and the release workflow share this job.
# Compile from this git checkout, run package tests, then check
# with the workspace CLI (not a globally installed npm `reqlan`).
# release.yml calls this workflow because a push to main
# must not tag or publish until JS compile, tests, and references succeed.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host native addon
        run: node scripts/ensure-host-native.mjs
      - name: Build TypeScript
        run: pnpm run build:tsc
      - name: Test packages
        run: pnpm run test
      - name: Check requirement references
        run: node packages/cli/bin/cli.js check --skip-target "**/.cursor/**"
