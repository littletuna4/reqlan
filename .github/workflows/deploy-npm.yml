name: Publish npm packages

# Triggered by language/v*, analytical/v*, and cli/v* tags (manual or release.yml)
# per reqlan rq/distribution/distribution.rq npm_distribution.
# release.yml also invokes this workflow directly because pushes made
# with GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    tags:
      - "language/v*"
      - "analytical/v*"
      - "cli/v*"
  workflow_call:
    inputs:
      npm_ref:
        description: Git ref (tag) to check out for the npm publish
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.npm_ref != '' && inputs.npm_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Publish must not reuse a cached package manager install.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build npm packages
        run: |
          pnpm run langium:generate
          pnpm exec tsc -b tsconfig.build.json
          pnpm --filter @reqlan/cli run build
          pnpm run build:readme

      # npm trusted publishing (OIDC): no NPM_TOKEN. Configure Trusted Publisher on
      # npmjs.com for @reqlan/language, @reqlan/analytical, and @reqlan/cli →
      # GitHub Actions / littletuna4 / reqlan / deploy-npm.yml / npm publish.
      # Each package is a separate step so already-published versions can skip.

      - name: Check @reqlan/language
        id: check_language
        run: node scripts/skip-already-published.mjs --filter "@reqlan/language"

      - name: Publish @reqlan/language
        if: steps.check_language.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/language" publish --access public --no-git-checks

      - name: Check @reqlan/analytical
        id: check_analytical
        run: node scripts/skip-already-published.mjs --filter "@reqlan/analytical"

      - name: Publish @reqlan/analytical
        if: steps.check_analytical.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/analytical" publish --access public --no-git-checks

      - name: Check @reqlan/cli
        id: check_cli
        run: node scripts/skip-already-published.mjs --filter "@reqlan/cli"

      - name: Publish @reqlan/cli
        if: steps.check_cli.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/cli" publish --access public --no-git-checks
