name: Publish npm packages

# Triggered by language/v*, analytical/v*, cli/v*, and mcp/v* tags (manual or release.yml)
# per reqlan rq/distribution/distribution.rq npm_distribution / rust_binary_distribution.
# release.yml also invokes this workflow directly because pushes made
# with GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    tags:
      - "language/v*"
      - "analytical/v*"
      - "cli/v*"
      - "mcp/v*"
  workflow_call:
    inputs:
      npm_ref:
        description: Git ref (tag) to check out for the npm publish
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  build-native:
    name: Build napi ${{ matrix.napi_suffix }}
    # Only needed when publishing analytical (or when workflow_call may publish all).
    # Always run on analytical/v* and workflow_call; skip on language/cli/mcp-only tags.
    if: >-
      startsWith(github.ref, 'refs/tags/analytical/v') ||
      github.event_name == 'workflow_call' ||
      startsWith(inputs.npm_ref, 'analytical/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - napi_suffix: linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - napi_suffix: linux-arm64-gnu
            rust_target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - napi_suffix: darwin-x64
            rust_target: x86_64-apple-darwin
            os: macos-latest
          - napi_suffix: darwin-arm64
            rust_target: aarch64-apple-darwin
            os: macos-latest
          - napi_suffix: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
            os: windows-latest
          - napi_suffix: win32-arm64-msvc
            rust_target: aarch64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.npm_ref != '' && inputs.npm_ref || github.ref }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: napi-${{ matrix.napi_suffix }}

      - name: Install linux cross linker (arm64)
        if: matrix.napi_suffix == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build reqlan-napi
        working-directory: crates
        run: cargo build -p reqlan-napi --release --target ${{ matrix.rust_target }}

      - name: Collect binary
        run: node scripts/collect-napi-binary.mjs --target ${{ matrix.napi_suffix }}

      - name: Upload napi artifact
        uses: actions/upload-artifact@v4
        with:
          name: napi-${{ matrix.napi_suffix }}
          path: artifacts/napi/${{ matrix.napi_suffix }}/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build-native]
    # build-native may be skipped on non-analytical tags; allow publish to proceed.
    if: always() && (needs.build-native.result == 'success' || needs.build-native.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.npm_ref != '' && inputs.npm_ref || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Publish must not reuse a cached package manager install.
          package-manager-cache: false

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # rq:["../../reqlan rq/development/build.rq".typescript_compile]
      - name: Build npm packages
        run: |
          pnpm run build:tsc
          pnpm --filter @reqlan/cli run build
          pnpm --filter @reqlan/mcp run build
          pnpm run build:readme

      - name: Download napi artifacts
        if: needs.build-native.result == 'success'
        uses: actions/download-artifact@v4
        with:
          path: artifacts/napi-download
          pattern: napi-*
          merge-multiple: false

      # Platform packages are Changesets-ignored. Copy version from
      # @reqlan/analytical (SSOT) and pin optionalDependencies for npm only.
      - name: Prepare native packages
        run: |
          set -euo pipefail
          if [ "${{ needs.build-native.result }}" = "success" ]; then
            mkdir -p artifacts/napi
            for dir in artifacts/napi-download/napi-*; do
              suffix="${dir##*/napi-}"
              mkdir -p "artifacts/napi/${suffix}"
              cp -a "${dir}/." "artifacts/napi/${suffix}/"
            done
            node scripts/prepare-native-packages.mjs --binary-dir artifacts/napi --publish-versions
          else
            # Pin optionalDependencies to this version even when this tag does
            # not rebuild napi. Git does not list those deps (Changesets ignore).
            node scripts/prepare-native-packages.mjs --publish-versions
          fi

      # npm trusted publishing (OIDC): no NPM_TOKEN. Configure Trusted Publisher on
      # npmjs.com for @reqlan/language, @reqlan/analytical, platform packages,
      # @reqlan/cli, and @reqlan/mcp → GitHub Actions / littletuna4 / reqlan /
      # deploy-npm.yml / npm publish.
      # Each package is a separate step so already-published versions can skip.

      - name: Check @reqlan/language
        id: check_language
        run: node scripts/skip-already-published.mjs --filter "@reqlan/language"

      - name: Publish @reqlan/language
        if: steps.check_language.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/language" publish --access public --no-git-checks

      # rq:["../../reqlan rq/distribution/distribution.rq".npm_distribution]
      # rq:["../../reqlan rq/distribution/distribution.rq".rust_binary_distribution]
      - name: Publish platform packages
        if: needs.build-native.result == 'success'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ready="artifacts/natives-ready.txt"
          : > "$ready"
          for pkg_dir in packages/analytical-native/*/; do
            name="$(node -p "require('./${pkg_dir}package.json').name")"
            out="$(mktemp)"
            GITHUB_OUTPUT="$out" node scripts/skip-already-published.mjs --filter "$name"
            should="$(grep '^should_publish=' "$out" | cut -d= -f2)"
            rm -f "$out"
            if [ "$should" = "true" ]; then
              bin="$(node -p "require('./${pkg_dir}package.json').main")"
              if [ ! -s "${pkg_dir}${bin}" ]; then
                echo "Refusing to publish $name: missing binary ${pkg_dir}${bin}"
                exit 1
              fi
              (cd "$pkg_dir" && npm publish --access public)
            else
              echo "skip $name"
            fi
            printf '%s\n' "$name" >> "$ready"
          done

      - name: Check @reqlan/analytical
        id: check_analytical
        run: node scripts/skip-already-published.mjs --filter "@reqlan/analytical"

      # Refuse @reqlan/analytical until every platform package of *its* version
      # is on npm or was published in this job. Version SSOT is
      # packages/analytical/package.json, not Changesets.
      - name: Require natives at @reqlan/analytical version
        if: steps.check_analytical.outputs.should_publish == 'true'
        run: node scripts/require-natives-published.mjs --ready-file artifacts/natives-ready.txt

      - name: Publish @reqlan/analytical
        if: steps.check_analytical.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/analytical" publish --access public --no-git-checks

      - name: Check @reqlan/cli
        id: check_cli
        run: node scripts/skip-already-published.mjs --filter "@reqlan/cli"

      - name: Publish @reqlan/cli
        if: steps.check_cli.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/cli" publish --access public --no-git-checks

      - name: Check @reqlan/mcp
        id: check_mcp
        run: node scripts/skip-already-published.mjs --filter "@reqlan/mcp"

      - name: Publish @reqlan/mcp
        if: steps.check_mcp.outputs.should_publish == 'true'
        run: pnpm --filter "@reqlan/mcp" publish --access public --no-git-checks
