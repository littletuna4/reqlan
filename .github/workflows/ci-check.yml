# rq:["../../reqlan rq/core_analysis/check.rq".check]
# rq:["../../reqlan rq/core_analysis/check.rq".check_meta_implementation]
# rq:["../../reqlan rq/core_analysis/check.rq".check_skip_targets]
# rq:["../../reqlan rq/distribution/distribution.rq".ci_gate]
name: Check references

# Pull requests run this workflow directly (CLI compile + `reqlan check` only).
# Full TypeScript compile and package tests run on main before versioning
# (ci-test.yml / prerelease_tests).
# release.yml also calls this workflow because a push to main
# must not tag or publish until requirement references resolve.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build host native addon
        run: node scripts/ensure-host-native.mjs
      - name: Build CLI
        run: pnpm run build:cli
      - name: Check requirement references
        run: pnpm run check -- --skip-target "**/.cursor/**"
