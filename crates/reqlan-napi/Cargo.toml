[package]
name = "reqlan-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Node-API binding for the core reqlan-analytical engine"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi8", "serde-json"] }
napi-derive = "2.16"
reqlan-analytical = { path = "../reqlan-analytical" }
reqlan-index = { path = "../reqlan-index" }
reqlan-parse = { path = "../reqlan-parse" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
napi-build = "2.1"
