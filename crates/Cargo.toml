[workspace]
resolver = "2"
members = [
    "reqlan-parse",
    "reqlan-index",
    "reqlan-search",
    "reqlan-export",
    "reqlan-analytical",
    "reqlan-napi",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-only"
repository = "https://github.com/littletuna4/reqlan.git"
rust-version = "1.82"

[workspace.dependencies]
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "2.0.0-rc.16", features = ["serde", "derive"] }
thiserror = "2"
walkdir = "2"
